<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giriş Yap / Kayıt Ol - Hoodie Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-black tracking-wider text-gray-900">
          HOODIE STORE
        </h1>
        <p class="text-sm text-gray-500 mt-1">
          Hesabınıza giriş yapın veya kaydolun
        </p>
      </div>

      <!-- Google ile Giriş -->
      <button
        id="google-login-btn"
        class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold py-2.5 px-4 rounded-xl shadow-sm transition mb-4"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path
            fill="#4285F4"
            d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"
          />
          <path
            fill="#34A853"
            d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.28v3.15C3.25 21.31 7.31 24 12 24z"
          />
          <path
            fill="#FBBC05"
            d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.28C.46 8.21 0 10.05 0 12s.46 3.79 1.28 5.42l4-3.15z"
          />
          <path
            fill="#EA4335"
            d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.69 1.28 6.58l4 3.15c.95-2.83 3.6-4.98 6.72-4.98z"
          />
        </svg>
        Google ile Giriş Yap
      </button>

      <div class="relative flex py-2 items-center mb-4">
        <div class="flex-grow border-t border-gray-200"></div>
        <span class="flex-shrink mx-4 text-gray-400 text-xs font-semibold"
          >VEYA E-POSTA İLE</span
        >
        <div class="flex-grow border-t border-gray-200"></div>
      </div>

      <!-- E-posta / Şifre Formu -->
      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1"
            >E-Posta Adresi</label
          >
          <input
            type="email"
            id="auth-email"
            required
            placeholder="ornek@mail.com"
            class="w-full px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1"
            >Şifre</label
          >
          <input
            type="password"
            id="auth-password"
            required
            placeholder="••••••••"
            class="w-full px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
          />
        </div>

        <div class="flex gap-3 pt-2">
          <button
            type="submit"
            id="login-submit-btn"
            class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition"
          >
            Giriş Yap
          </button>
          <button
            type="button"
            id="register-submit-btn"
            class="w-1/2 bg-gray-800 hover:bg-black text-white font-bold py-2.5 rounded-xl text-sm transition"
          >
            Kayıt Ol
          </button>
        </div>
      </form>

      <p
        id="auth-error"
        class="text-xs text-red-500 text-center mt-4 hidden"
      ></p>

      <div class="text-center mt-6">
        <a
          href="index.html"
          class="text-xs text-gray-500 hover:text-gray-800 font-semibold"
          >← Mağazaya Dön</a
        >
      </div>
    </div>

    <script type="module" src="auth.js"></script>
  </body>
</html>
