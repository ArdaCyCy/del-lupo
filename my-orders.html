<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siparişlerim — Del Lupo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;900&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #050505;
        color: #fff;
      }
    </style>
  </head>
  <body
    class="antialiased selection:bg-white selection:text-black min-h-screen flex flex-col justify-between"
  >
    <!-- Navbar -->
    <header
      class="bg-[#050505]/95 backdrop-blur-md border-b border-zinc-900 sticky top-0 z-40"
    >
      <div
        class="max-w-[1440px] mx-auto px-4 sm:px-6 py-3 flex md:grid md:grid-cols-3 items-center justify-between"
      >
        <nav
          class="hidden md:flex items-center gap-8 text-sm font-bold tracking-widest uppercase text-zinc-300"
        >
          <a href="index.html" class="hover:text-white transition">Ana Sayfa</a>
          <a
            href="index.html#products-section"
            class="hover:text-white transition"
            >Koleksiyonlar</a
          >
        </nav>

        <a
          href="index.html"
          class="text-xl sm:text-2xl font-black tracking-tighter text-white uppercase md:justify-self-center"
        >
          Del Lupo<span class="text-zinc-600">.</span>
        </a>

        <div class="flex items-center justify-end gap-3">
          <a
            href="index.html"
            class="bg-white text-black font-bold px-3 py-1.5 sm:px-4 sm:py-2 rounded-sm text-[10px] sm:text-xs uppercase tracking-wider hover:bg-zinc-200 transition"
            >Mağaza</a
          >
        </div>
      </div>
    </header>

    <!-- Ana İçerik -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-16 flex-1 w-full">
      <h1
        class="text-2xl sm:text-3xl font-black tracking-tight text-white uppercase mb-2"
      >
        Siparişlerim & İade Talepleri
      </h1>
      <p class="text-xs text-zinc-500 mb-10">
        Geçmiş siparişlerinizi takip edebilir, kargo durumunu görebilir ve iade
        talebi oluşturabilirsiniz.
      </p>

      <div id="orders-list" class="space-y-6">
        <p class="text-zinc-500 text-xs py-10 text-center">
          Siparişleriniz yükleniyor...
        </p>
      </div>
    </main>

    <!-- Footer -->
    <footer
      class="border-t border-zinc-900 bg-[#050505] text-zinc-400 py-12 mt-20"
    >
      <div
        class="max-w-[1440px] mx-auto px-6 lg:px-12 text-center text-xs text-zinc-600"
      >
        <p>© 2026 Del Lupo. Tüm hakları saklıdır.</p>
      </div>
    </footer>

    <script type="module" src="my-orders.js"></script>
  </body>
</html>
