<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cüzdanım — Del Lupo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;900&display=swap");
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #050505;
        color: #fff;
      }
    </style>
  </head>
  <body
    class="antialiased selection:bg-white selection:text-black min-h-screen flex flex-col justify-between"
  >
    <!-- Navbar (Kayma Yapmayan 3 Sütunlu Sabit Grid Yapı) -->
    <header
      class="bg-[#050505]/95 backdrop-blur-md border-b border-zinc-900 sticky top-0 z-40"
    >
      <div
        class="max-w-[1440px] mx-auto px-6 py-4 grid grid-cols-3 items-center"
      >
        <nav
          class="hidden md:flex items-center gap-8 text-sm font-bold tracking-widest uppercase text-zinc-300"
        >
          <a href="index.html" class="hover:text-white transition">Ana Sayfa</a>
          <a
            href="index.html#products-section"
            class="hover:text-white transition"
            >Koleksiyonlar</a
          >
        </nav>
        <a
          href="index.html"
          class="text-2xl font-black tracking-tighter text-white uppercase justify-self-center"
        >
          Del Lupo<span class="text-zinc-600">.</span>
        </a>
        <div class="flex items-center justify-end gap-6">
          <a
            href="index.html"
            class="bg-white text-black font-bold px-4 py-2 rounded-sm text-xs uppercase tracking-wider hover:bg-zinc-200 transition"
            >Mağaza</a
          >
        </div>
      </div>
    </header>

    <!-- Ana İçerik -->
    <main class="max-w-xl mx-auto px-6 py-16 flex-1 w-full">
      <div
        class="bg-[#111] border border-zinc-900 rounded-3xl p-8 shadow-2xl space-y-8"
      >
        <div>
          <span
            class="text-[10px] font-black uppercase tracking-widest text-zinc-500 block mb-1"
            >Del Lupo Pay</span
          >
          <h1 class="text-3xl font-black tracking-tight text-white uppercase">
            Dijital Cüzdanım
          </h1>
        </div>

        <!-- Bakiye Kartı -->
        <div
          class="bg-zinc-950 border border-zinc-800 p-6 rounded-2xl flex justify-between items-center"
        >
          <div>
            <p class="text-xs text-zinc-400 uppercase tracking-widest mb-1">
              Mevcut Bakiye
            </p>
            <h2 id="wallet-balance" class="text-4xl font-black text-white">
              €0.00
            </h2>
          </div>
          <div
            class="w-12 h-12 rounded-full bg-white text-black flex items-center justify-center font-black text-xl"
          >
            €
          </div>
        </div>

        <!-- Para Yükleme Formu -->
        <form id="topup-form" class="space-y-4">
          <h3 class="text-xs font-bold uppercase tracking-widest text-zinc-300">
            Cüzdana Bakiye Yükle
          </h3>
          <div>
            <label
              class="block text-[10px] font-bold text-zinc-500 mb-2 uppercase"
              >Yüklemek İstediğiniz Tutar (€)</label
            >
            <div class="grid grid-cols-3 gap-3 mb-3">
              <button
                type="button"
                onclick="setAmount(20)"
                class="preset-btn bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 py-2.5 rounded-xl text-xs font-bold text-white transition"
              >
                €20
              </button>
              <button
                type="button"
                onclick="setAmount(50)"
                class="preset-btn bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 py-2.5 rounded-xl text-xs font-bold text-white transition"
              >
                €50
              </button>
              <button
                type="button"
                onclick="setAmount(100)"
                class="preset-btn bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 py-2.5 rounded-xl text-xs font-bold text-white transition"
              >
                €100
              </button>
            </div>
            <input
              type="number"
              id="topup-amount"
              required
              min="5"
              placeholder="Örn: 75"
              class="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-white outline-none focus:border-white transition"
            />
          </div>

          <div>
            <label
              class="block text-[10px] font-bold text-zinc-500 mb-2 uppercase"
              >Kart Bilgileri (Simülasyon)</label
            >
            <input
              type="text"
              required
              maxlength="19"
              placeholder="4000 1234 5678 9010"
              class="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-xs text-white outline-none mb-3"
            />
            <div class="grid grid-cols-2 gap-3">
              <input
                type="text"
                required
                placeholder="AA/YY"
                class="px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-xs text-white outline-none"
              />
              <input
                type="text"
                required
                maxlength="3"
                placeholder="CVC"
                class="px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-xs text-white outline-none"
              />
            </div>
          </div>

          <button
            type="submit"
            id="topup-btn"
            class="w-full bg-white hover:bg-zinc-200 text-black font-black py-4 rounded-xl text-xs uppercase tracking-widest transition cursor-pointer"
          >
            Cüzdana Para Yükle
          </button>
        </form>
      </div>
    </main>

    <footer
      class="border-t border-zinc-900 bg-[#050505] text-zinc-400 py-12 mt-20"
    >
      <div
        class="max-w-[1440px] mx-auto px-6 lg:px-12 text-center text-xs text-zinc-600"
      >
        <p>© 2026 Del Lupo. Tüm hakları saklıdır.</p>
      </div>
    </footer>

    <script type="module" src="wallet.js"></script>
  </body>
</html>
